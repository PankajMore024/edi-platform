name: CI

on:
  push:
    branches: [master, main, testbranch]
  pull_request:

jobs:
  platform:
    name: platform · typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (unit · golden · property)
        run: npm test -- --ci
